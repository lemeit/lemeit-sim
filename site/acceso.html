<!doctype html>
<html lang="es-AR" class="simprox-root"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ingreso · ΣIM</title><link rel="icon" href="assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="simprox-theme.css"><link rel="stylesheet" href="style.css"><script src="theme-toggle.js" defer></script><script src="acceso.js" defer></script></head>
<body class="access-page"><header class="portal-header access-portal-header"><a href="/" class="portal-brand"><img src="assets/sim-wordmark.svg" alt="ΣIM" width="100" height="30"><span>Simulación de procesos</span></a><nav class="admin-header-navigation" aria-label="Áreas de ΣIM"><a href="/" class="portal-header-link">Simulador</a><span class="admin-current-area" aria-current="page">Acceso</span></nav><button id="theme-toggle" class="tex-theme-toggle" type="button" aria-label="Cambiar tema" title="Cambiar tema"><svg class="moon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg><svg class="sun" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2M1 12h2m18 0h2M4.22 4.22l1.42 1.42m12.72 12.72 1.42 1.42m0-15.56-1.42 1.42M5.64 18.36l-1.42 1.42"/></svg></button></header><main class="access-layout"><div class="access-brand"><img src="assets/sim-wordmark.svg" alt="ΣIM" width="130" height="38"><span>Simulación de procesos</span></div>
<section class="access-card" aria-labelledby="access-title"><p class="access-eyebrow">BIENVENIDO A ΣIM</p><h1 id="access-title">Acceso al simulador</h1><p id="access-description" class="access-description">Ingresá el código de tu clase para comenzar.</p>
<p id="access-notice" class="access-current portal-message" role="status" hidden></p>
<div id="access-current" class="access-current" hidden><p id="access-current-label"></p><a id="access-continue" class="portal-button primary" href="/">Continuar</a><button id="access-switch" type="button" class="portal-button">Cerrar sesión y cambiar acceso</button></div>
<form id="access-form"><fieldset class="access-roles"><legend>Tipo de acceso</legend><label><input type="radio" name="role" value="student" checked><span>Alumno</span></label><label><input type="radio" name="role" value="admin"><span>Administrador</span></label></fieldset>
<label class="portal-field" id="access-code-label">Código de clase<input id="access-code" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="16" required placeholder="Ingresá el código de 12 caracteres"></label>
<label class="portal-field" id="access-password-label" hidden>Contraseña de administrador<input id="access-password" type="password" autocomplete="current-password" disabled></label>
<button id="access-submit" type="submit" class="portal-button primary">Ingresar al simulador <span aria-hidden="true">→</span></button><p id="access-message" class="portal-message" role="status" aria-live="polite"></p></form>
<p class="access-footnote" id="access-footnote">Acceso por código · Sin cuenta de correo</p></section><p class="access-caption">ΣIM · Simulación de procesos</p></main></body></html>
