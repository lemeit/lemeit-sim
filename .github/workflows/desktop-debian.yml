name: Paquete piloto Desktop para Debian
on:
  pull_request:
    paths: ['desktop/**', 'site/**', 'server.py', 'dynamic_tank_mcp.py', 'recycle.py', '.github/workflows/desktop-debian.yml']
  push:
    branches: [main]
    paths: ['desktop/**', 'site/**', 'server.py', 'dynamic_tank_mcp.py', 'recycle.py', '.github/workflows/desktop-debian.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bookworm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: rust:bookworm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - run: apt-get update && apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev dpkg-dev gnupg
      - run: bash desktop/scripts/build-debian.sh desktop/dist
      - name: Comprobar instalación y construir un índice APT de prueba
        shell: bash
        run: |
          set -euo pipefail
          package=$(find desktop/dist -name '*.deb' -print)
          apt-get install -y --no-install-recommends "./$package"
          test -x /usr/lib/sim-desktop/sim-desktop
          test -f /usr/share/sim-desktop/site/index.html
          python3 -B /usr/share/sim-desktop/server.py --help >/dev/null
          test -z "$(ldd /usr/lib/sim-desktop/sim-desktop | grep 'not found' || true)"
          export GNUPGHOME=$(mktemp -d)
          trap 'rm -rf "$GNUPGHOME"' EXIT
          gpg --batch --passphrase '' --quick-generate-key 'ΣIM CI <ci@lemeit.ar>' ed25519 sign 1d
          fingerprint=$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1=="fpr" {print $10; exit}')
          aptroot=$(mktemp -d)
          chmod 755 "$aptroot"
          mkdir -p "$aptroot/lists/partial"
          aptopts=(-o "Dir::Etc::sourcelist=$aptroot/source.list" -o Dir::Etc::sourceparts=- -o "Dir::State::lists=$aptroot/lists")
          gpg --batch --export "$fingerprint" > "$aptroot/key.gpg"
          printf 'deb [signed-by=%s] file:%s bookworm main\n' "$aptroot/key.gpg" "$aptroot/repo" > "$aptroot/source.list"
          dpkg-deb -R "$package" "$GNUPGHOME/previous"
          sed -i 's/^Version:.*/Version: 0.0.0~ci/' "$GNUPGHOME/previous/DEBIAN/control"
          dpkg-deb --root-owner-group -b "$GNUPGHOME/previous" "$GNUPGHOME/previous.deb"
          apt-get remove -y sim-desktop
          bash desktop/scripts/index-apt.sh "$GNUPGHOME/previous.deb" "$aptroot/repo" "$fingerprint"
          apt-get "${aptopts[@]}" update
          apt-get "${aptopts[@]}" install -y --no-install-recommends sim-desktop
          test "$(dpkg-query -W -f='${Version}' sim-desktop)" = '0.0.0~ci'
          bash desktop/scripts/index-apt.sh "$package" "$aptroot/repo" "$fingerprint"
          gpg --batch --verify "$aptroot/repo/dists/bookworm/InRelease"
          apt-get "${aptopts[@]}" update
          apt-get "${aptopts[@]}" install -y --only-upgrade --no-install-recommends sim-desktop
          test "$(dpkg-query -W -f='${Version}' sim-desktop)" = "$(dpkg-deb -f "$package" Version)"
      - uses: actions/upload-artifact@v4
        with:
          name: sim-desktop-debian12-amd64
          path: desktop/dist/
          if-no-files-found: error
